name: Apollyon

on:
  pull_request:
  push:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: thedatakey/apollyon/.github/actions/apollyon@v0.3.0
        with:
          path: .
          fail-on: high
