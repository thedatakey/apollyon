[package]
name = "apollyon"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
authors = ["Tom Koentjes"]
description = "Evidence-first source code security scanner for human-written and AI-generated projects."
license = "MIT"
readme = "README.md"
repository = "https://github.com/thedatakey/apollyon"
publish = false
keywords = ["security", "static-analysis", "sast", "sarif", "code-scanning"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
tree-sitter = "=0.25.10"
tree-sitter-c = "=0.24.2"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-cpp = "=0.23.4"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-kotlin-ng = "=1.1.0"
tree-sitter-language = "=0.1.5"
tree-sitter-php = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-ruby = "=0.23.1"
tree-sitter-rust = "=0.24.2"
tree-sitter-swift = "=0.7.3"
tree-sitter-typescript = "=0.23.2"

[[bin]]
name = "apollyon"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
