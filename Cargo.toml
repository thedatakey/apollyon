[package]
name = "apollyon"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
authors = ["Tom Koentjes"]
description = "A bounded, evidence-first source-security assessment runner."
license = "MIT"
readme = "README.md"
repository = "https://github.com/thedatakey/apollyon"
keywords = ["security", "static-analysis", "rust", "cybersecurity"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "apollyon"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
