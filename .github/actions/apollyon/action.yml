name: Apollyon source scan
description: Build the pinned action revision, scan a repository, and optionally upload SARIF.
inputs:
  path:
    description: Repository-relative path to scan.
    required: false
    default: .
  fail-on:
    description: Minimum severity that fails the job (info, medium, high, or never).
    required: false
    default: high
  baseline:
    description: Optional repository-relative Apollyon baseline path.
    required: false
    default: ""
  upload-sarif:
    description: Upload the report to GitHub code scanning.
    required: false
    default: "true"
outputs:
  sarif-file:
    description: Absolute path to the generated SARIF file.
    value: ${{ steps.scan.outputs.sarif-file }}
  exit-code:
    description: Apollyon scan exit code.
    value: ${{ steps.scan.outputs.exit-code }}
runs:
  using: composite
  steps:
    - name: Identify action source
      id: source
      shell: bash
      env:
        ACTION_SOURCE: ${{ github.action_path }}
      run: |
        cd "$ACTION_SOURCE/../../.."
        digest=$({
          find src data -type f -print0 | sort -z | xargs -0 sha256sum
          sha256sum Cargo.toml Cargo.lock docs/CLI.txt .github/actions/apollyon/action.yml
          if [[ -f build.rs ]]; then sha256sum build.rs; fi
        } | sha256sum | cut -d ' ' -f 1)
        echo "digest=$digest" >> "$GITHUB_OUTPUT"

    - name: Restore exact source build
      id: binary-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/apollyon-action
        key: apollyon-source-v1-${{ runner.os }}-${{ runner.arch }}-rust1.85.0-${{ steps.source.outputs.digest }}

    - name: Install tested Rust toolchain
      if: steps.binary-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        rustup toolchain install 1.85.0 --profile minimal --no-self-update

    - name: Build action revision
      if: steps.binary-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        ACTION_SOURCE: ${{ github.action_path }}
      run: |
        cargo +1.85.0 install --locked \
          --path "${ACTION_SOURCE}/../../.." \
          --root "$RUNNER_TEMP/apollyon-action"

    - name: Run Apollyon
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_BASELINE: ${{ inputs.baseline }}
      run: |
        sarif="$RUNNER_TEMP/apollyon-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sarif"
        arguments=(scan "$INPUT_PATH" --format sarif --output "$sarif" --fail-on "$INPUT_FAIL_ON")
        if [[ -n "$INPUT_BASELINE" ]]; then
          arguments+=(--baseline "$INPUT_BASELINE")
        fi
        set +e
        "$RUNNER_TEMP/apollyon-action/bin/apollyon" "${arguments[@]}"
        code=$?
        set -e
        echo "sarif-file=$sarif" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' && always() }}
      uses: github/codeql-action/upload-sarif@fddeee1a7ece751b577e409a89057319e3172939 # v4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: apollyon

    - name: Enforce scan result
      if: ${{ always() }}
      shell: bash
      env:
        APOLLYON_EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
      run: exit "$APOLLYON_EXIT_CODE"
