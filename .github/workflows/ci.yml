name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tested Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup default 1.97.1
          rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Smoke test CLI help
        run: cargo run --locked -- --help
      - name: Build debug binary for contract tests
        run: cargo build --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Validate project agent files
        run: python3 scripts/validate_agents.py
      - name: Validate portable agent integrations
        run: python3 scripts/validate_integrations.py
      - name: Validate machine-output contracts
        run: python3 scripts/validate_outputs.py target/debug/apollyon
      - name: Validate public release contract
        run: python3 scripts/validate_release.py
      - name: Validate benchmark scoring and release packaging
        run: |
          python3 -m unittest discover -s benchmarks -p 'test_*.py'
          python3 tests/test_release_packaging.py
          python3 scripts/validate_phase4.py
      - name: Validate VS Code SARIF viewer
        run: |
          node --check vscode-apollyon/extension.js
          node --check vscode-apollyon/sarif.js
          node --test vscode-apollyon/test/*.test.js

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - name: Check minimum supported Rust
        run: cargo +1.85.0 check --locked

  portability:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tested Rust
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - name: Test portable build
        run: cargo +1.97.1 test --locked --all-targets --all-features

  action:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise local composite Action
        uses: ./.github/actions/apollyon
        with:
          path: tests/fixtures/manual-project
          fail-on: never
          upload-sarif: "false"
